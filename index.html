<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendhee's Booth</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Betania+Patmos+In&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/menu.css" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="index.html">
        <img src="assets/logo.png" alt="Vendhee Logo" class="logo" />
      </a>
    </header>

    <main>
      <div class="steps-wrapper">
        <div class="step-item">
          <div class="step active">1</div>
          <div class="step-label">Design</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step">2</div>
          <div class="step-label">Mode</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step">3</div>
          <div class="step-label">Capture</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step">4</div>
          <div class="step-label">Download</div>
        </div>
      </div>
      <div class="grid" id="grid">
        <!-- Cards injected by JS -->
      </div>
    </main>

    <div class="bottom-bar">
      <div class="selected-info" id="selected-info">No design selected yet</div>
      <button
        class="btn-primary btn-next"
        id="btn-next"
        disabled
        onclick="goNext()"
      >
        Continue
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <script src="scripts/menu.js"></script>
  </body>
</html>
