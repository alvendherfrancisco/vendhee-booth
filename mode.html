<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How would you like to take your photos?</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Betania+Patmos+In&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/menu.css" />
    <link rel="stylesheet" href="styles/mode.css" />
  </head>
  <body>
    <header>
      <button class="back-btn" onclick="window.location.href = 'index.html'">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        Back
      </button>
    </header>

    <main>
      <div class="steps-wrapper">
        <div class="step-item">
          <div class="step done">1</div>
          <div class="step-label">Design</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step active">2</div>
          <div class="step-label">Mode</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step">3</div>
          <div class="step-label">Capture</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step">4</div>
          <div class="step-label">Download</div>
        </div>
      </div>

      <div class="mode-heading">
        <h1>How would you like to add your photos?</h1>
      </div>

      <div class="mode-cards">
        <!-- Camera -->
        <div class="mode-card take-upload" onclick="chooseMode('camera')">
          <div class="mode-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"
              />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </div>
          <div>
            <div class="mode-label">Take Photos</div>
          </div>
        </div>

        <!-- Upload -->
        <div class="mode-card take-upload" onclick="chooseMode('upload')">
          <div class="mode-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </div>
          <div>
            <div class="mode-label">Upload Photos</div>
          </div>
        </div>
      </div>
    </main>

    <script>
      function chooseMode(mode) {
        localStorage.setItem("vendee_mode", mode);
        window.location.href = "capture.html";
      }
    </script>
  </body>
</html>
