<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Strip</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/final.css" />
  </head>
  <body style="opacity: 0; transition: opacity 0.5s ease">
    <header>
      <button class="back-btn" onclick="window.location.href = 'capture.html'">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        Retake
      </button>
    </header>

    <main>
      <div class="steps-wrapper">
        <div class="step-item">
          <div class="step done">1</div>
          <div class="step-label">Design</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step done">2</div>
          <div class="step-label">Mode</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step done">3</div>
          <div class="step-label">Capture</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
          <div class="step active">4</div>
          <div class="step-label">Download</div>
        </div>
      </div>

      <div class="strip-card">
        <div class="strip-outer" id="strip-outer">
          <div class="loading-strip" id="loading">
            <div class="spinner"></div>
            <span>Composing your strip…</span>
          </div>
          <canvas id="strip-canvas" style="display: none"></canvas>
        </div>

        <div class="actions">
          <a
            class="btn-primary btn-download"
            id="btn-download"
            href="#"
            download="vendees-booth-strip.png"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"
              />
            </svg>
            Download Strip
          </a>
          <button
            class="btn-ghost"
            onclick="window.location.href = 'capture.html'"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                d="M1 4v6h6M23 20v-6h-6M20.49 9A9 9 0 005.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 013.51 15"
              />
            </svg>
            Retake Photos
          </button>
          <button
            class="btn-text"
            onclick="window.location.href = 'index.html'"
          >
            Start over with a new design →
          </button>
        </div>
      </div>
    </main>

    <canvas id="work-canvas" style="display: none"></canvas>
    <script src="scripts/script.js"></script>
    <script src="scripts/final.js"></script>
  </body>
</html>
